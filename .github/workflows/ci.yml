name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-boundary:
    name: Public boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test the boundary scanner
        run: node --test scripts/verify-public-boundary.test.mjs
      - name: Scan tracked public source
        if: github.event.repository.private == false
        run: node scripts/verify-public-boundary.mjs --tracked
      - name: Scan tracked internal source
        if: github.event.repository.private
        run: node scripts/verify-public-boundary.mjs --tracked --internal-checkout

  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test deployment automation
        run: |
          node --test landing/deploy-worker.test.mjs
          node --test scripts/create-cloudflare-config.test.mjs
          node --test scripts/verify-release-version.test.mjs
      - name: Run project checks
        run: npm run check
