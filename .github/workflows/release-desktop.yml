name: Release desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  macos:
    name: Signed and notarized macOS release
    if: github.event.repository.private == false && vars.DESKTOP_RELEASE_ENABLED == 'true'
    runs-on: macos-latest
    timeout-minutes: 90
    environment:
      name: desktop-release
      url: ${{ steps.release_draft.outputs.releaseHtmlUrl }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit merged to main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The release tag must point to a commit merged into main."
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag and package versions
        id: release
        run: |
          node scripts/verify-release-version.mjs
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Test release automation
        run: |
          node --test scripts/create-cloudflare-config.test.mjs
          node --test scripts/verify-release-version.test.mjs
      - name: Scan tracked public source
        run: node scripts/verify-public-boundary.mjs --tracked
      - name: Run project checks
        run: npm run check
      - name: Check release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_ISSUER \
            APPLE_API_KEY_ID \
            APPLE_API_PRIVATE_KEY \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured in desktop-release."
              missing=1
            fi
          done
          exit "$missing"
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          api_key_path="$RUNNER_TEMP/app-store-connect.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$api_key_path"
          chmod 600 "$api_key_path"
          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Create draft release
        id: release_draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          matching_releases="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -s --arg tag "$RELEASE_TAG" \
                '[.[][] | select(.tag_name == $tag)]'
          )"
          release_count="$(jq 'length' <<<"$matching_releases")"
          expected_prerelease="${{ steps.release.outputs.prerelease }}"

          if [[ "$release_count" -eq 0 ]]; then
            release_args=(
              --draft
              --generate-notes
              --title "God of Sessions $RELEASE_TAG"
              --verify-tag
            )
            if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
              release_args+=(--prerelease)
            fi
            release_url="$(gh release create "$RELEASE_TAG" "${release_args[@]}")"
            test -n "$release_url"
          elif [[ "$release_count" -eq 1 ]]; then
            if [[ "$(jq -r '.[0].draft' <<<"$matching_releases")" != "true" ]]; then
              echo "::error::The existing release for $RELEASE_TAG is not a draft."
              exit 1
            fi
            if [[ "$(jq -r '.[0].prerelease' <<<"$matching_releases")" != "$expected_prerelease" ]]; then
              echo "::error::The existing draft has the wrong prerelease status."
              exit 1
            fi
            release_url="$(jq -r '.[0].html_url' <<<"$matching_releases")"
          else
            echo "::error::Expected at most one release for $RELEASE_TAG."
            exit 1
          fi
          echo "releaseHtmlUrl=$release_url" >> "$GITHUB_OUTPUT"
      - name: Build signed and notarized universal DMG
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          export APPLE_API_KEY="$APPLE_API_KEY_PATH"
          npx electron-builder \
            --mac dmg \
            --universal \
            --publish never \
            --config.forceCodeSigning=true \
            --config.mac.notarize=true \
            --config.mac.x64ArchFiles='Contents/Resources/app.asar.unpacked/node_modules/{@earendil-works/pi-tui/native/darwin/prebuilds/**,@mariozechner/clipboard-darwin-arm64/**}' \
            --config.dmg.writeUpdateInfo=false \
            --config.artifactName='God-of-Sessions_${arch}.${ext}' \
            --config.directories.output="$RUNNER_TEMP/electron-builder-output"
      - name: Verify release artifacts and create checksum
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/electron-builder-output/mac-universal/God of Sessions.app"
          executable="$app/Contents/MacOS/God of Sessions"
          dmg="$RUNNER_TEMP/electron-builder-output/God-of-Sessions_universal.dmg"
          checksum="$RUNNER_TEMP/electron-builder-output/God-of-Sessions_universal.dmg.sha256"

          test -d "$app"
          test -s "$executable"
          test -s "$dmg"
          architectures="$(lipo -archs "$executable")"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --verbose --type exec "$app"
          xcrun stapler validate "$app"
          hdiutil verify "$dmg"
          mount_point="$RUNNER_TEMP/god-of-sessions-release-dmg"
          mkdir "$mount_point"
          hdiutil attach "$dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" || true' EXIT
          mounted_app="$mount_point/God of Sessions.app"
          mounted_executable="$mounted_app/Contents/MacOS/God of Sessions"
          test -d "$mounted_app"
          test -s "$mounted_executable"
          mounted_architectures="$(lipo -archs "$mounted_executable")"
          [[ " $mounted_architectures " == *" arm64 "* ]]
          [[ " $mounted_architectures " == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$mounted_app"
          spctl --assess --verbose --type exec "$mounted_app"
          xcrun stapler validate "$mounted_app"
          hdiutil detach "$mount_point"
          trap - EXIT

          (
            cd "$RUNNER_TEMP/electron-builder-output"
            shasum -a 256 "God-of-Sessions_universal.dmg" \
              > "God-of-Sessions_universal.dmg.sha256"
            shasum -a 256 --check "God-of-Sessions_universal.dmg.sha256"
          )
          test -s "$checksum"
      - name: Upload DMG and SHA-256 checksum to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/electron-builder-output/God-of-Sessions_universal.dmg" \
            "$RUNNER_TEMP/electron-builder-output/God-of-Sessions_universal.dmg.sha256" \
            --clobber
      - name: Verify the complete release remains a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          releases_json="$(
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -s 'add'
          )"
          if ! release="$(
            jq -e --arg tag "$RELEASE_TAG" '
                map(select(.tag_name == $tag))
                | if length == 1 then .[0] else empty end
              ' <<<"$releases_json"
          )"; then
            echo "::error::Expected exactly one release for $RELEASE_TAG."
            exit 1
          fi

          if [[ "$(jq -r '.draft' <<<"$release")" != "true" ]]; then
            echo "::error::The release was published before verification."
            exit 1
          fi
          if [[ "$(jq -r '.prerelease' <<<"$release")" != "${{ steps.release.outputs.prerelease }}" ]]; then
            echo "::error::The draft has the wrong prerelease status."
            exit 1
          fi

          if ! jq -e '
              (.assets | length) == 2
              and ([.assets[].name] | sort) == [
                "God-of-Sessions_universal.dmg",
                "God-of-Sessions_universal.dmg.sha256"
              ]
              and all(.assets[]; .size > 0)
            ' <<<"$release" >/dev/null
          then
            echo "::error::Draft must contain exactly the non-empty DMG and checksum."
            exit 1
          fi
      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/app-store-connect.p8"
