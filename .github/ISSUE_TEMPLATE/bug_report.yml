name: Bug report
description: Report a reproducible problem using synthetic or redacted evidence.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve God of Sessions.

        Do not attach credentials, provider transcripts, private repository names,
        personal absolute paths, unredacted logs, or screenshots containing private
        data. Report security vulnerabilities through GitHub's private vulnerability
        reporting flow described in `SECURITY.md`, not in a public issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, transcripts, private repository names, and local paths.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observable problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Use synthetic project, session, provider, and filesystem names.
      placeholder: |
        1. Start with ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Select the provider route involved, if any.
      options:
        - None / provider-neutral
        - Codex
        - Claude Code
        - Grok
        - Cursor
        - Hermes
        - OpenClaw
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: God of Sessions version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15.5 (Apple silicon)
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted evidence
      description: Optional. Prefer a minimal synthetic fixture over logs or screenshots.
